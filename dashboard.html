<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn AI Agent - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Override global body style for this page */
        body {
            background: #000000 !important;
            /* Ensure purely black background */
        }
    </style>
</head>

<body>

    <!-- Background Elements (Stars Only, No Glows) -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>

    <!-- Connection Lines SVG Layer -->
    <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;">
        <!-- Lines will be dynamically injected here -->
    </svg>

    <!-- Main Dashboard -->
    <div class="dashboard-layout">

        <!-- Left: Profile Section -->
        <div class="profile-left" id="profile-node">
            <div class="profile-glow-ring"></div>
            <div class="profile-image-container">
                <!-- Replaced UN avatar with 3D AI Robot avatar -->
                <img src="https://robohash.org/LinkedInAIAgent?set=set1&size=400x400" alt="AI Avatar"
                    class="profile-img">
                <div class="status-indicator"></div>
            </div>
            <!-- Added ID for dynamic email update -->
            <div class="agent-title" id="user-name-display">User Name</div>
            <!-- Changed color to Green (#00ff88) -->
            <div class="agent-subtitle"
                style="color: #00ff88; opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);">
                <i class="fab fa-linkedin" style="color: #0A66C2; margin-right: 8px; text-shadow: none;"></i>AI Agent
            </div>
        </div>

        <!-- Right: Feature Actions -->
        <div class="features-right">

            <!-- Item 1: Connect -->
            <div class="feature-item pos-1" id="btn-1">
                <div class="orb">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="feature-label">Connect</div>
            </div>

            <!-- Item 2: Search Best Leads -->
            <div class="feature-item pos-2" id="btn-2">
                <div class="orb">
                    <i class="fas fa-search-dollar"></i> <!-- Updated icon for context -->
                </div>
                <div class="feature-label">Search Best Leads</div>
            </div>

            <!-- Item 3: Follow Up Messages -->
            <div class="feature-item pos-3" id="btn-3">
                <div class="orb large">
                    <i class="fas fa-comments"></i>
                </div>
                <div class="feature-label">Follow Up Messages</div>
            </div>

            <!-- Item 4: Reaction -->
            <div class="feature-item pos-4" id="btn-5">
                <div class="orb">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="feature-label">Reaction on Posts</div>
            </div>

            <!-- Item 5: Create Post -->
            <div class="feature-item pos-5" id="btn-4">
                <div class="orb">
                    <i class="fas fa-edit"></i>
                </div>
                <div class="feature-label">Create Post</div>
            </div>

        </div>
    </div>

    <!-- Subscribe Button -->
    <a href="payment.html" target="_blank" class="subscribe-floating-btn">
        <i class="fas fa-crown"></i> Subscribe Now
    </a>

    <!-- Chat Support Widget -->
    <div class="chat-support-container">
        <div class="chat-tooltip">Need Help?</div>
        <!-- Updated Chat behavior and alignment -->
        <div class="chat-avatar-wrapper"
            onclick="alert('Support: +91-9873641909'); window.open('https://wa.me/qr/3NRZ4QLVI6VEJ1', '_blank')">
            <div class="ping"></div>
            <img src="https://res.cloudinary.com/df4ax8siq/image/upload/v1771421888/photo_6253489198229211179_y_lkzxsa.jpg"
                alt="Support" class="chat-img">
            <div class="online-dot"></div>
        </div>
        <div class="chat-name">Sagar</div>
    </div>

    <script>
        // --- User Identity Update ---
        // --- User Identity Update ---
        document.addEventListener('DOMContentLoaded', () => {
            const userEmail = localStorage.getItem('user_email');
            const userName = localStorage.getItem('user_name');
            const userNameDisplay = document.getElementById('user-name-display');

            if (userNameDisplay) {
                if (userName) {
                    userNameDisplay.innerText = userName;
                } else if (userEmail) {
                    userNameDisplay.innerText = userEmail;
                }
            }
        });

        const svg = document.getElementById('connections-layer');
        const profile = document.getElementById('profile-node');
        const buttons = [
            document.getElementById('btn-1'),
            document.getElementById('btn-2'),
            document.getElementById('btn-3'),
            document.getElementById('btn-5'), // Reaction now 4th
            document.getElementById('btn-4')  // Create Post now 5th (last)
        ];

        let isDragging = false;
        let activeBtn = null;
        let dragOffset = { x: 0, y: 0 };
        let startPos = { left: 0, top: 0 };
        let hasMoved = false; // Track real movement to distinguish drag vs click

        // --- Status Logic ---
        function updateButtonStatus() {
            buttons.forEach(btn => {
                const btnId = btn.id;
                const isActive = localStorage.getItem(btnId + '_status') === 'ON';

                let badge = btn.querySelector('.status-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'status-badge';
                    btn.appendChild(badge);
                }

                if (isActive) {
                    badge.innerText = 'ON';
                    badge.classList.add('active');
                } else {
                    badge.innerText = 'OFF';
                    badge.classList.remove('active');
                }
            });
        }

        function drawConnectors() {
            // Clear existing lines
            while (svg.firstChild) {
                svg.removeChild(svg.firstChild);
            }

            const profileRect = profile.getBoundingClientRect();
            // Start point: Center right of the profile image container
            const startX = profileRect.right - 20;
            const startY = profileRect.top + (profileRect.height / 3);

            buttons.forEach((btn, index) => {
                const btnRect = btn.getBoundingClientRect();
                // End point: Left middle of the button
                const endX = btnRect.left;
                const endY = btnRect.top + (btnRect.height / 2);

                const distanceX = Math.abs(endX - startX);
                const cp1X = startX + (distanceX * 0.4);
                const cp1Y = startY;
                // Adjust control point 2 to account for vertical movement
                const cp2X = endX - (distanceX * 0.4);
                const cp2Y = endY;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const d = `M ${startX} ${startY} C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${endX} ${endY}`;

                path.setAttribute("d", d);
                // Styles
                path.style.fill = "none";
                path.style.stroke = "rgba(255, 255, 255, 0.15)";
                path.style.strokeWidth = "1.5px";
                path.style.strokeDasharray = "6 4";
                path.style.filter = "drop-shadow(0 0 3px rgba(108, 99, 255, 0.3))";

                // Only animate opacity on first load, not during drag
                if (!isDragging) {
                    path.style.transition = "opacity 0.5s";
                    path.style.opacity = "0";
                    setTimeout(() => path.style.opacity = "1", 100 * index);
                } else {
                    path.style.opacity = "1";
                    path.style.transition = "none";
                }

                svg.appendChild(path);
            });
        }

        // Initialize Absolute Positions for Dragging
        function initDraggable() {
            const container = document.querySelector('.dashboard-layout');
            const containerRect = container.getBoundingClientRect();

            // Store initial positions first to avoid layout shift during loop
            const initialRects = buttons.map(btn => btn.getBoundingClientRect());

            buttons.forEach((btn, index) => {
                const rect = initialRects[index];

                // Convert to absolute
                btn.style.position = 'absolute';
                btn.style.left = (rect.left - containerRect.left) + 'px';
                btn.style.top = (rect.top - containerRect.top) + 'px';
                btn.style.margin = '0'; // Remove flex margins
                btn.style.width = getComputedStyle(btn).width; // Freeze width

                // Add Drag Events
                btn.addEventListener('mousedown', startDrag);
                // Handle Click explicitly, separating from drag
                btn.addEventListener('click', (e) => {
                    if (!hasMoved) {
                        handleBtnClick(btn.id);
                    }
                });
            });

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);
        }

        function handleBtnClick(btnId) {
            console.log("Navigating for:", btnId);

            if (btnId === 'btn-1' || btnId === 'btn-2') { // Connect or Search Best Leads
                window.location.href = 'connect.html';
            } else if (btnId === 'btn-3') { // Follow Up Messages
                window.location.href = 'followup.html';
            } else if (btnId === 'btn-5') { // Reaction on Posts
                window.location.href = 'reactions.html';
            } else if (btnId === 'btn-4') { // Create Post
                window.location.href = 'payment.html';
            } else {
                alert("This feature setup page is under construction. Once configured, status will turn ON.");
            }
        }

        function startDrag(e) {
            // Prevent dragging if clicking interactable children usually, but here the whole button is handle
            activeBtn = e.currentTarget;
            isDragging = true;
            hasMoved = false; // Reset move flag

            const rect = activeBtn.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;

            startPos = {
                left: activeBtn.style.left,
                top: activeBtn.style.top
            };

            activeBtn.style.cursor = 'grabbing';
            activeBtn.style.zIndex = '100'; // Bring to front
            activeBtn.style.transition = 'none'; // Disable hover transition during drag
        }

        function onDrag(e) {
            if (!isDragging || !activeBtn) return;
            e.preventDefault();
            hasMoved = true; // Use this to ignore click event later

            const container = document.querySelector('.dashboard-layout');
            const containerRect = container.getBoundingClientRect();

            const newX = e.clientX - containerRect.left - dragOffset.x;
            const newY = e.clientY - containerRect.top - dragOffset.y;

            activeBtn.style.left = newX + 'px';
            activeBtn.style.top = newY + 'px';

            requestAnimationFrame(drawConnectors);
        }

        function endDrag(e) {
            if (!isDragging || !activeBtn) return;

            // Collision Detection
            if (checkCollision(activeBtn)) {
                // Revert position
                activeBtn.style.left = startPos.left;
                activeBtn.style.top = startPos.top;
            }

            activeBtn.style.cursor = 'pointer';
            activeBtn.style.zIndex = '';
            activeBtn.style.transition = ''; // Restore CSS transition

            isDragging = false;
            activeBtn = null;

            drawConnectors();
        }

        function checkCollision(targetBtn) {
            const targetRect = targetBtn.getBoundingClientRect();

            for (let btn of buttons) {
                if (btn === targetBtn) continue;

                const rect = btn.getBoundingClientRect();

                if (!(targetRect.right < rect.left ||
                    targetRect.left > rect.right ||
                    targetRect.bottom < rect.top ||
                    targetRect.top > rect.bottom)) {
                    return true; // Overlapping
                }
            }
            return false;
        }

        // Initialize
        window.addEventListener('load', () => {
            updateButtonStatus(); // Initialize badges

            // Initialize layout based on window width
            function handleResponsiveLayout() {
                const isDesktop = window.innerWidth > 768;

                if (isDesktop) {
                    drawConnectors();
                    setTimeout(() => {
                        initDraggable();
                        drawConnectors();
                    }, 100);
                } else {
                    // Cleanup absolute positioning for mobile
                    buttons.forEach(btn => {
                        btn.style.position = '';
                        btn.style.left = '';
                        btn.style.top = '';
                        btn.style.width = '';
                    });
                }
            }

            handleResponsiveLayout();

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    drawConnectors();
                } else {
                    // Reset to flex layout on mobile resize
                    buttons.forEach(btn => {
                        btn.style.position = '';
                        btn.style.left = '';
                        btn.style.top = '';
                        btn.style.width = '';
                    });
                }
            });
        });
    </script>

</html>
