<body>

    <!-- Background Elements -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>
    <div class="bottom-glow"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Login View -->
    <div class="login-view" id="login-view">
        <div class="login-card">
            <div class="brand-title">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/LinkedIn_Logo.svg/1024px-LinkedIn_Logo.svg.png"
                    alt="LinkedIn" style="height: 30px; vertical-align: middle; filter: brightness(0) invert(1);">
                <span style="vertical-align: middle;">AI Agent</span>
            </div>
            <div class="login-subtitle">Sign in to access your autonomous agent</div>

            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="text" id="email" class="input-field" placeholder="Email or Phone" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="input-field" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">
                    <span>Connect Account</span>
                </button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard View Removed (Moved to dashboard.html) -->

    <!-- Chat Support Widget -->
    <div class="chat-support-container">
        <div class="chat-tooltip">Need Help?</div>
        <div class="chat-avatar-wrapper">
            <div class="ping"></div>
            <img src="https://ui-avatars.com/api/?name=Support&background=6C63FF&color=fff" alt="Support"
                class="chat-img">
            <div class="online-dot"></div>
        </div>
    </div>
