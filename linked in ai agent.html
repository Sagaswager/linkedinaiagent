<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn AI Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="form_handler.js"></script>
    <style>
        /* --- Save Credentials Modal --- */
        .save-creds-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        .save-creds-overlay.show {
            display: flex;
        }

        .save-creds-box {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(108, 99, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .save-creds-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6C63FF, #00F0FF);
        }

        .save-creds-icon {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #6C63FF, #00F0FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .save-creds-title {
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .save-creds-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .save-creds-btns {
            display: flex;
            gap: 12px;
        }

        .creds-btn {
            flex: 1;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .creds-btn-yes {
            background: linear-gradient(135deg, #6C63FF 0%, #00F0FF 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
        }

        .creds-btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.6);
        }

        .creds-btn-never {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
        }

        .creds-btn-never:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>
    <div class="bottom-glow"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Login View -->
    <div class="login-view" id="login-view">
        <div class="login-card">
            <div class="brand-title">
                <i class="fab fa-linkedin"
                    style="font-size: 36px; color: #0A66C2; vertical-align: middle; margin-right: 8px;"></i>
                <span style="vertical-align: middle; color: white; font-weight: 600;">LinkedIn <span
                        style="font-weight: 300; opacity: 0.8;">AI Agent</span></span>
            </div>
            <div class="login-subtitle">Activate Now</div>

            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="user-name" class="input-field" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fab fa-whatsapp input-icon"></i>
                    <input type="tel" id="whatsapp-number" class="input-field" placeholder="WhatsApp Number" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="text" id="email" class="input-field" placeholder="Linkedin Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="input-field" placeholder="Linkedin Password" required>
                </div>
                <div
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 15px; margin-top: -10px; text-align: left; padding-left: 5px;">
                    <i class="fas fa-info-circle" style="margin-right: 4px;"></i> You will receive confirmation mail on
                    LinkedIn/Mail
                </div>
                <button type="submit" class="premium-btn premium-btn-primary">
                    <span>Connect Account</span>
                </button>
                <div id="error-message" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard View Removed (Moved to dashboard.html) -->

    <!-- Chat Support Widget -->
    <div class="chat-support-container">
        <div class="chat-tooltip">Need Help?</div>
        <!-- Updated Chat behavior and alignment -->
        <div class="chat-avatar-wrapper"
            onclick="alert('Whatsapp Now: +91-9873641909'); window.open('https://wa.me/qr/3NRZ4QLVI6VEJ1', '_blank')">
            <div class="ping"></div>
            <img src="./Support%20Avatar.jpeg" alt="Support" class="chat-img">
            <div class="online-dot"></div>
        </div>
        <div class="chat-name">Sagar</div>
    </div>

    <script>
        // On page load: check if credentials are saved → auto-redirect
        window.addEventListener('load', () => {
            const credsSaved = localStorage.getItem('creds_saved');
            const savedEmail = localStorage.getItem('user_email');
            const savedName = localStorage.getItem('user_name');
            const savedWhatsapp = localStorage.getItem('user_whatsapp');

            // If user chose to save credentials, skip login entirely
            if (credsSaved === 'yes' && savedEmail && savedName) {
                localStorage.setItem('just_logged_in', 'true');
                window.location.href = 'dashboard.html';
                return;
            }

            // Otherwise pre-fill what we have (but still force them to log in)
            if (savedEmail) document.getElementById('email').value = savedEmail;
            if (savedName) document.getElementById('user-name').value = savedName;
            if (savedWhatsapp) document.getElementById('whatsapp-number').value = savedWhatsapp;
        });

        // Handle the Save Credentials modal choice - now handled in dashboard.html

        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const name = document.getElementById('user-name').value;
            const whatsapp = document.getElementById('whatsapp-number').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDisplay = document.getElementById('error-message');
            const loginCard = document.querySelector('.login-card');

            // Simple Validation
            if (!name || !whatsapp || !email || !password) {
                errorDisplay.innerText = "Please fill all fields.";
                errorDisplay.style.display = "block";
                return;
            }

            errorDisplay.style.display = "none";
            const btn = document.querySelector('.premium-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> INITIALIZING...';
            btn.disabled = true;

            // Save user details for later pages
            localStorage.setItem('user_email', email);
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_whatsapp', whatsapp);

            try {
                // 1. Submit Data to Google Sheet (Optional but kept for tracking)
                if (typeof saveToGoogleSheet === 'function') {
                    saveToGoogleSheet({
                        email: email,
                        name: name,
                        whatsapp: whatsapp,
                        source: 'LinkedIn Connect'
                    }).catch(err => console.error("Sheet save error:", err));
                }

                // 2. We no longer connect to Unipile here. 
                // We simply store the password to be used on the dashboard approval step.
                localStorage.setItem('user_password', password);
                localStorage.setItem('just_logged_in', 'true');

                btn.innerHTML = '<i class="fas fa-check"></i> SUCCESS!';
                btn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Connection error:', error);
                errorDisplay.innerText = error.message;
                errorDisplay.style.display = 'block';

                // Reset button
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        });

        // We can safely leave this or remove it, it won't be used here anymore
        async function checkAccountStatus(accountId) {
            try {
                const response = await fetch(`https://api20.unipile.com:15048/api/v1/accounts/${accountId}`, {
                    method: 'GET',
                    headers: {
                        'X-API-KEY': 'GZ4Napww.06tYodoW/wclbYDfXer1uh0c0hwOt2JOaTz2b7spddg=',
                        'accept': 'application/json'
                    }
                });
                const result = await response.json();
                return result.status;
            } catch (err) {
                console.error("Status check error:", err);
                return 'error';
            }
        }
    </script>
</body>

</html>
