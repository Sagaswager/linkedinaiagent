<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Outreach - LinkedIn AI Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="form_handler.js"></script>

    <style>
        body {
            background-color: #000000 !important;
            background: #000000 !important;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* FLEX CONTAINER - Safer than Grid for this interaction */
        .content-wrapper {
            width: 90%;
            max-width: 1600px;
            margin: 0 auto;
            padding-top: 2rem;
            padding-bottom: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            position: relative;
            z-index: 10;
        }

        /* No sidebar needed */
        .left-column {
            display: none;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                width: 95%;
                gap: 2rem;
            }

            .left-column {
                flex: 0 0 300px;
            }
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
                padding-top: 5rem;
            }

            .left-column {
                flex: 1 1 100%;
                position: relative;
                top: 0;
            }

            .strategy-sidebar {
                padding: 1.5rem;
            }

            .page-title {
                margin-top: 2rem;
            }
        }

        .strategy-sidebar {
            background: rgba(30, 30, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-title {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .helper-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .template-area {
            width: 100%;
            background: rgba(10, 10, 20, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            padding: 1.5rem;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
            min-height: 200px;
        }

        .template-area:focus {
            border-color: var(--primary);
        }

        /* Right Column: Flexible */
        .right-column {
            flex: 1;
            min-width: 300px;
            display: block;
            /* Ensure it takes space */
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        /* Stream Card */
        .stream-card {
            background: rgba(255, 255, 255, 0.08);
            /* Increase visibility */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            /* Force Visibility */
            opacity: 1 !important;
            visibility: visible !important;
            transform: none !important;
        }

        .stream-card:hover {
            transform: translateY(-5px) !important;
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .stream-card.active {
            border-color: var(--accent);
            background: rgba(40, 40, 60, 0.6);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .stream-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stream-title {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stream-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 13px;
            position: relative;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .stream-card.active .toggle-switch {
            background: var(--primary);
        }

        .stream-card.active .toggle-switch::after {
            transform: translateX(24px);
        }

        .stream-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Specific Comment Input inside Card */
        .card-comment-area {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            padding: 10px;
            resize: vertical;
            min-height: 80px;
            margin-top: 0.5rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .card-comment-area:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.6);
        }

        .stream-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .stream-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .stream-input:focus {
            border-color: var(--accent);
        }

        /* Start Button Section */
        .start-section {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 4rem;
            padding-bottom: 4rem;
        }

        .start-btn {
            padding: 1rem 5rem;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.6);
        }

        /* Nav */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 50;
        }

        .page-header {
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>

    <!-- Starry Background -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>

    <!-- Navigation -->
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

    <!-- Main Wrapper -->
    <div class="content-wrapper">

        <div style="width: 100%; text-align: center; margin-bottom: 2rem;">
            <h1 style="color: white; font-size: 2.5rem; margin-bottom: 0.5rem;"><i class="fab fa-linkedin"
                    style="color: #0A66C2; margin-right: 15px;"></i>Commenting on Posts</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">Configure automated comments based on your AI prompt.
            </p>
        </div>

        <!-- Left Column: Hidden -->

        <!-- Right Column: Cards -->
        <div class="right-column">
            <div class="cards-container">
                <!-- Single Stream: Comment Prompt -->
                <div class="stream-card active" onclick="toggleStream(this)">
                    <div class="stream-header">
                        <div class="stream-title">
                            <div class="stream-icon"><i class="fas fa-comment-dots"></i></div>
                            Automated Commenting
                        </div>
                        <div class="toggle-switch"></div>
                    </div>
                    <p class="stream-desc">AI will read each post and Comment accordingly based on your prompt.</p>
                    <textarea class="card-comment-area" id="comment-prompt" placeholder="Prompt for Comment on Posts (e.g. Write an engaging, positive comment agreeing with the post's main point...)"
                        onclick="event.stopPropagation()" style="min-height: 120px;"></textarea>
                </div>
            </div> <!-- End cards-container -->

            <!-- Start Button Area -->
            <div class="start-section" style="margin-top: 3rem; text-align: center;">
                <div class="btn-group">
                    <button class="premium-btn premium-btn-primary" id="start-btn" onclick="startOutreach()">
                        <i class="fas fa-play"></i> Start Now
                    </button>
                </div>
            </div>

        </div> <!-- End right-column -->

    </div> <!-- End content-wrapper -->

    <!-- Chat Support Widget -->
    <div class="chat-support-container">
        <div class="chat-tooltip">Need Help?</div>
        <div class="chat-avatar-wrapper"
            onclick="alert('Support: +91-9873641909'); window.open('https://wa.me/qr/3NRZ4QLVI6VEJ1', '_blank')">
            <div class="ping"></div>
            <img src="./Support%20Avatar.jpeg"
                alt="Support" class="chat-img">
            <div class="online-dot"></div>
        </div>
        <div class="chat-name">Sagar</div>
    </div>

    <script>
        // Load Settings on Start
        window.addEventListener('DOMContentLoaded', loadAllSettings);

        function loadAllSettings() {
            console.log("Loading saved comment configuration...");
            const saved = localStorage.getItem('comment_prompt_config');
            if (!saved) return;
            
            document.getElementById('comment-prompt').value = saved;
            document.getElementById('start-btn').innerHTML = '<i class="fas fa-sync"></i> Update';
        }

        function saveAllSettings(isManual = false) {
            const prompt = document.getElementById('comment-prompt').value;
            localStorage.setItem('comment_prompt_config', prompt);

            if (isManual) {
                const saveBtn = document.getElementById('save-btn');
                const originalText = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                setTimeout(() => saveBtn.innerHTML = originalText, 2000);
            }
            return prompt;
        }



        // Enhanced Toggle with Auto-Save
        async function toggleStream(card) {
            card.classList.toggle('active');
            const prompt = saveAllSettings(false);
            
            const isActive = card.classList.contains('active');
            if (isActive) {
                card.style.borderColor = '#00ff88';
                setTimeout(() => card.style.borderColor = '', 500);

                if (typeof window.saveToGoogleSheet === 'function') {
                    await window.saveToGoogleSheet({ comment_prompt: prompt });
                }
            }
        }

        async function startOutreach() {
            const btn = document.getElementById('start-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> INITIALIZING...';
            btn.disabled = true;

            const prompt = saveAllSettings(false);

            if (typeof window.saveToGoogleSheet === 'function') {
                await window.saveToGoogleSheet({ comment_prompt: prompt });
            }

            setTimeout(() => {
                localStorage.setItem('btn-5_status', 'ON');
                window.location.href = 'dashboard.html';
            }, 1000);
        }
    </script>
</body>

</html>
