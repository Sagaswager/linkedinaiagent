<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment for a Month - LinkedIn AI Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000000 !important;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* Changed from center to flex-start to allow scrolling without clipping top */
            padding-top: 80px;
            /* Space for back button */
            padding-bottom: 40px;
            overflow-y: auto;
            position: relative;
        }

        .payment-container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .payment-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        .payment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .plan-title {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .plan-price {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            margin: 1.5rem 0;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .plan-period {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .features-list {
            list-style: none;
            margin: 2rem 0;
            text-align: left;
            padding: 0 1rem;
        }

        .features-list li {
            color: white;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
        }

        .features-list li i {
            color: #00ff88;
            margin-right: 12px;
            font-size: 1.1rem;
        }

        .pay-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
            margin-top: 1rem;
        }

        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>
    <div class="bg-glow bg-glow-1" style="top: -10%; left: -10%;"></div>
    <div class="bg-glow bg-glow-2" style="bottom: -10%; right: -10%;"></div>

    <!-- Back Button -->
    <a href="dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>

    <div class="payment-container">
        <div class="payment-card">
            <h1 class="plan-title">Pro Access</h1>
            <div class="plan-price">₹ 1800<span class="plan-period">/Month</span></div>

            <ul class="features-list">
                <li><i class="fas fa-check-circle"></i> AI-Powered Connecions Building & Messaging</li>
                <li><i class="fas fa-check-circle"></i> Smart Lead Generations</li>
                <li><i class="fas fa-check-circle"></i> Automate Messaging</li>
                <li><i class="fas fa-check-circle"></i> Automated Post Reactions</li>
                <li style="color: #25D366; font-weight: 600; text-shadow: 0 0 10px rgba(37, 211, 102, 0.3);">
                    <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> Available 24/7 via WhatsApp
                </li>
            </ul>

            <!-- UPI QR Code Section -->
            <div class="qr-section" style="margin-bottom: 2rem;">
                <div
                    style="background: white; padding: 10px; border-radius: 16px; display: inline-block; box-shadow: 0 0 20px rgba(255,255,255,0.2);">
                    <img src="https://res.cloudinary.com/df4ax8siq/image/upload/v1771422333/photo_6102412817358065534_y_mwmrvq.jpg"
                        alt="Scan to Pay" style="width: 250px; height: auto; display: block; border-radius: 8px;">
                </div>
                <div style="margin-top: 15px; color: var(--text-muted); font-size: 0.95rem; letter-spacing: 0.5px;">Scan
                    to Pay via UPI</div>
            </div>

            <button class="whatsapp-green-btn"
                onclick="alert('Please send a screenshot of your payment to WhatsApp: +91-9873641909\n\nClick OK to open WhatsApp.'); window.open('https://wa.me/qr/3NRZ4QLVI6VEJ1', '_blank')">
                <i class="fab fa-whatsapp" style="font-size: 1.4rem;"></i> Pay Confirm with Team
            </button>
            <br>
            <a href="dashboard.html" class="back-link">Cancel & Return to Dashboard</a>
        </div>
    </div>

    <!-- Chat Support Widget -->
    <div class="chat-support-container">
        <div class="chat-tooltip">Need Help?</div>
        <div class="chat-avatar-wrapper"
            onclick="alert('Support: +91-9873641909'); window.open('https://wa.me/qr/3NRZ4QLVI6VEJ1', '_blank')">
            <div class="ping"></div>
            <img src="https://res.cloudinary.com/df4ax8siq/image/upload/v1771421888/photo_6253489198229211179_y_lkzxsa.jpg"
                alt="Support" class="chat-img">
            <div class="online-dot"></div>
        </div>
        <div class="chat-name">Sagar</div>
    </div>

</body>

</html>
