<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>target-search-simple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --bg: #07101b;
            --bg-2: #0c1a2c;
            --panel: rgba(18, 29, 46, 0.72);
            --panel-border: rgba(255, 255, 255, 0.14);
            --text: #f4f7fb;
            --muted: #a9b6c8;
            --primary: #2ea3ff;
            --primary-2: #0a84ff;
            --success: #32d583;
            --danger: #ff6b6b;
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at left top, rgba(16, 92, 182, 0.24), transparent 30%),
                radial-gradient(circle at 80% 0%, rgba(46, 163, 255, 0.12), transparent 26%),
                linear-gradient(180deg, #040b14 0%, #06101b 36%, #07101b 100%);
            padding: 40px 20px 60px;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: clamp(2rem, 2.5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 28px;
        }

        .top-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            align-items: start;
        }

        .filter-wrap {
            position: relative;
        }

        .filter-btn {
            width: 100%;
            min-height: 92px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.025));
            border: 1px solid var(--panel-border);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), var(--shadow);
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .filter-btn.active {
            border-color: rgba(46, 163, 255, 0.45);
            box-shadow: 0 0 0 4px rgba(46, 163, 255, 0.08), var(--shadow);
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .icon-orb {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.18);
            flex-shrink: 0;
        }

        .filter-label {
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .chev {
            color: var(--muted);
            flex-shrink: 0;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            z-index: 30;
            padding: 14px;
            border-radius: 22px;
            background: rgba(9, 17, 29, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .dropdown.show {
            display: block;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            outline: none;
        }

        .option-list {
            display: grid;
            gap: 8px;
            max-height: 220px;
            overflow: auto;
        }

        .option-item {
            border: 0;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            cursor: pointer;
        }

        .option-item:hover,
        .option-item.selected {
            background: rgba(46, 163, 255, 0.14);
            color: #dff0ff;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            min-height: 22px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(46, 163, 255, 0.12);
            border: 1px solid rgba(46, 163, 255, 0.18);
            color: #dcefff;
            font-size: 0.88rem;
        }

        .tag button {
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .start-wrap {
            display: flex;
            justify-content: center;
            margin-top: 34px;
            margin-bottom: 36px;
        }

        .start-btn {
            min-width: 220px;
            min-height: 58px;
            padding: 16px 28px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 14px 34px rgba(10, 132, 255, 0.35);
        }

        .status {
            text-align: center;
            color: var(--muted);
            margin-top: -12px;
            margin-bottom: 28px;
            min-height: 24px;
        }

        .results-panel {
            border-radius: 28px;
            background: rgba(11, 20, 33, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .results-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .result-count {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .results-body {
            padding: 22px 24px 26px;
        }

        .empty-state {
            color: var(--muted);
            text-align: center;
            padding: 32px 12px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 18px;
        }

        .profile-card {
            padding: 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .profile-name {
            font-size: 1.03rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .profile-meta {
            color: var(--muted);
            font-size: 0.92rem;
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .profile-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            color: #8fcbff;
            text-decoration: none;
            font-weight: 600;
        }

        .top-mini {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .api-input {
            width: min(100%, 360px);
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            outline: none;
            text-align: center;
        }

        @media (max-width: 900px) {
            .top-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-mini" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="dashboard.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- API URL hidden from users — hardcoded in JS below -->
                <input id="apiBaseUrl" type="hidden" value="https://linkedinaiagent-ipvf.onrender.com" />
                <button onclick="handleLogout()" style="background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.3); color: #ff4d4d; padding: 6px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;">
                    Logout
                </button>
            </div>
        </div>
        <h1 class="title">Target Search</h1>

        <div class="top-actions">
            <div class="filter-wrap" id="person-wrap">
                <button class="filter-btn" type="button" onclick="toggleDropdown('person')">
                    <div class="filter-left">
                        <span class="icon-orb"><i class="fa-solid fa-user-tie"></i></span>
                        <span class="filter-label">Person</span>
                    </div>
                    <i class="fa-solid fa-chevron-down chev"></i>
                </button>
                <div class="dropdown" id="person-dropdown">
                    <input class="search-box" type="text" placeholder="Type and press Enter"
                        onkeyup="filterOptions('person', event)">
                    <div class="option-list" id="person-options"></div>
                </div>
                <div class="tag-row" id="person-tags"></div>
            </div>

            <div class="filter-wrap" id="location-wrap">
                <button class="filter-btn" type="button" onclick="toggleDropdown('location')">
                    <div class="filter-left">
                        <span class="icon-orb"><i class="fa-solid fa-location-dot"></i></span>
                        <span class="filter-label">Location</span>
                    </div>
                    <i class="fa-solid fa-chevron-down chev"></i>
                </button>
                <div class="dropdown" id="location-dropdown">
                    <input class="search-box" type="text" placeholder="Type location and press Enter"
                        onkeyup="filterOptions('location', event)">
                    <div class="option-list" id="location-options"></div>
                </div>
                <div class="tag-row" id="location-tags"></div>
            </div>

            <div class="filter-wrap" id="industry-wrap">
                <button class="filter-btn" type="button" onclick="toggleDropdown('industry')">
                    <div class="filter-left">
                        <span class="icon-orb"><i class="fa-solid fa-briefcase"></i></span>
                        <span class="filter-label">Industry</span>
                    </div>
                    <i class="fa-solid fa-chevron-down chev"></i>
                </button>
                <div class="dropdown" id="industry-dropdown">
                    <input class="search-box" type="text" placeholder="Type industry and press Enter"
                        onkeyup="filterOptions('industry', event)">
                    <div class="option-list" id="industry-options"></div>
                </div>
                <div class="tag-row" id="industry-tags"></div>
            </div>
        </div>

        <div class="start-wrap">
            <button id="startBtn" class="start-btn" onclick="startSearch()">Start</button>
        </div>
        <div id="status" class="status">Choose target filters and click Start.</div>

        <section class="results-panel">
            <div class="results-header">
                <h2>Result</h2>
                <div id="resultCount" class="result-count">0 profiles</div>
            </div>
            <div id="resultsBody" class="results-body">
                <div class="empty-state">LinkedIn profiles found by the agent will appear here.</div>
            </div>
        </section>
    </div>

    <script>
        const state = {
            selections: { person: [], location: [], industry: [] },
            suggestions: {
                person: ['Founder', 'Investor', 'CEO', 'CTO', 'Recruiter', 'Sales Manager'],
                location: ['Dubai, UAE', 'Mumbai, India', 'London, UK', 'Noida, India'],
                industry: ['Technology', 'Real Estate', 'Finance', 'Healthcare', 'SaaS']
            }
        };

        function renderOptions(type, items) {
            const wrap = document.getElementById(`${type}-options`);
            wrap.innerHTML = '';
            items.forEach(item => {
                const title = typeof item === 'string' ? item : item.title;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-item' + (state.selections[type].includes(title) ? ' selected' : '');
                btn.textContent = title;
                btn.onclick = () => toggleSelection(type, title);
                wrap.appendChild(btn);
            });
        }

        function renderTags(type) {
            const row = document.getElementById(`${type}-tags`);
            row.innerHTML = '';
            state.selections[type].forEach(value => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${escapeHtml(value)} <button type="button" onclick="removeTag('${type}', '${escapeJs(value)}')"><i class="fa-solid fa-xmark"></i></button>`;
                row.appendChild(tag);
            });
            renderOptions(type, state.suggestions[type]);
        }

        function toggleDropdown(type) {
            document.querySelectorAll('.dropdown').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.filter-btn').forEach(el => el.classList.remove('active'));
            const dropdown = document.getElementById(`${type}-dropdown`);
            const btn = document.querySelector(`#${type}-wrap .filter-btn`);
            const isOpen = dropdown.classList.contains('show');
            if (!isOpen) {
                dropdown.classList.add('show');
                btn.classList.add('active');
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.filter-wrap')) {
                document.querySelectorAll('.dropdown').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.filter-btn').forEach(el => el.classList.remove('active'));
            }
        });

        async function filterOptions(type, event) {
            const input = document.querySelector(`#${type}-dropdown .search-box`);
            const value = input.value.trim();
            if (event.key === 'Enter' && value) {
                toggleSelection(type, value);
                input.value = '';
                return;
            }
            if (!value) {
                renderOptions(type, state.suggestions[type]);
                return;
            }
            if ((type === 'location' || type === 'industry') && value.length >= 2) {
                try {
                    const api = document.getElementById('apiBaseUrl').value.trim().replace(/\/$/, '');
                    const endpoint = type === 'location' ? '/resolve/locations' : '/resolve/industries';
                    const res = await fetch(`${api}${endpoint}?q=${encodeURIComponent(value)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const items = (data.items && data.items.length) ? data.items : [value];
                        renderOptions(type, items);
                        return;
                    }
                } catch (_) { }
            }
            const filtered = state.suggestions[type].filter(item => item.toLowerCase().includes(value.toLowerCase()));
            renderOptions(type, filtered.length ? filtered : [value]);
        }

        function toggleSelection(type, value) {
            const clean = String(value).trim();
            if (!clean) return;
            if (state.selections[type].includes(clean)) {
                state.selections[type] = state.selections[type].filter(item => item !== clean);
            } else {
                state.selections[type].push(clean);
                if (!state.suggestions[type].includes(clean)) state.suggestions[type].unshift(clean);
            }
            renderTags(type);
        }

        function removeTag(type, value) {
            state.selections[type] = state.selections[type].filter(item => item !== value);
            renderTags(type);
        }
        window.removeTag = removeTag;

        async function startSearch() {
            const api = document.getElementById('apiBaseUrl').value.trim().replace(/\/$/, '');
            const status = document.getElementById('status');
            const startBtn = document.getElementById('startBtn');
            const resultCount = document.getElementById('resultCount');
            const resultsBody = document.getElementById('resultsBody');

            const payload = {
                user_name: 'Lead Search',
                professions: state.selections.person,
                locations: state.selections.location,
                industries: state.selections.industry,
                limit: 10,
                max_pages: 5,
                save_to_sheet: false
            };

            // ✅ Save selections to Google Sheet
            if (typeof window.saveToGoogleSheet === 'function') {
                window.saveToGoogleSheet({
                    location: state.selections.location.join(', '),
                    person: state.selections.person.join(', '),
                    industry: state.selections.industry.join(', ')
                });
            }

            if (!payload.professions.length && !payload.locations.length && !payload.industries.length) {
                status.textContent = 'Please choose at least one target.';
                status.style.color = 'var(--danger)';
                return;
            }

            status.textContent = 'Agent is searching profiles...';
            status.style.color = 'var(--muted)';
            startBtn.disabled = true;
            startBtn.textContent = 'Searching...';

            try {
                const res = await fetch(`${api}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Search failed');

                const profiles = Array.isArray(data.profiles) ? data.profiles : [];
                resultCount.textContent = `${profiles.length} profile${profiles.length === 1 ? '' : 's'}`;

                if (!profiles.length) {
                    resultsBody.innerHTML = '<div class="empty-state">No profiles found for this targeting.</div>';
                } else {
                    resultsBody.innerHTML = `<div class="results-grid">${profiles.map(profile => `
            <div class="profile-card">
              <div class="profile-name">${escapeHtml(profile.full_name || 'Unknown')}</div>
              <div class="profile-meta">${escapeHtml(profile.occupation || 'No occupation')}</div>
              <div class="profile-meta">${escapeHtml(profile.location || 'No location')}</div>
              <a class="profile-link" href="${escapeAttr(profile['Linkedin URL'] || '#')}" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-linkedin"></i> View LinkedIn
              </a>
            </div>
          `).join('')}</div>`;
                }

                status.textContent = 'Search completed.';
                status.style.color = 'var(--success)';
            } catch (error) {
                status.textContent = error.message || 'Something went wrong.';
                status.style.color = 'var(--danger)';
                resultsBody.innerHTML = '<div class="empty-state">Unable to fetch result right now.</div>';
                resultCount.textContent = '0 profiles';
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = 'Start';
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }
        function escapeAttr(str) { return escapeHtml(str); }
        function escapeJs(str) { return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

        ['person', 'location', 'industry'].forEach(type => renderTags(type));

        function handleLogout() {
            if (confirm("Logout from LinkedIn AI Agent?")) {
                localStorage.removeItem('unipile_account_id');
                localStorage.removeItem('just_logged_in');
                localStorage.removeItem('pending_checkpoint');
                localStorage.removeItem('pending_account_id');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
    <script src="form_handler.js"></script>
</body>

</html>
