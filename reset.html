<!DOCTYPE html>
<html>

<head>
    <title>Reset Account</title>
    <style>
        body {
            background: #000;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(20, 20, 30, 0.9);
        }

        .box h1 {
            color: #00F0FF;
            margin-bottom: 10px;
        }

        .box p {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>🔄 Account Reset</h1>
        <p>Clearing all saved data...</p>
        <p id="status">Processing...</p>
    </div>
    <script>
        localStorage.clear();
        document.getElementById('status').innerHTML = '✅ Done! All data cleared.<br><br>Redirecting to login...';
        document.getElementById('status').style.color = '#00ff88';
        setTimeout(() => {
            window.location.href = 'linked in ai agent.html';
        }, 2000);
    </script>
</body>

</html>
